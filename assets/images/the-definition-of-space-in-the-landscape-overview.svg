<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Definition of Space in the Landscape｜更新版核心功能</title>
  <desc id="desc">四個步驟：A4 內裁切與比例模組、弧線分割、植栽空間、牆體與限制檢核。</desc>
  <style>
    .bg{fill:#f8f6ee}.ink{fill:#263b30}.muted{fill:#607067}.line{stroke:#263b30;stroke-width:2;fill:none}.thin{stroke:#839187;stroke-width:1.5;fill:none}.dash{stroke:#839187;stroke-width:1.5;stroke-dasharray:7 6;fill:none}.rule{stroke:#d4d8cf;stroke-width:2}.number{font:700 38px 'Noto Sans TC','PingFang TC',sans-serif}.heading{font:700 23px 'Noto Sans TC','PingFang TC',sans-serif}.body{font:500 16px 'Noto Sans TC','PingFang TC',sans-serif}.small{font:500 14px 'Noto Sans TC','PingFang TC',sans-serif}.note{font:600 13px 'Noto Sans TC','PingFang TC',sans-serif}.dim{font:600 14px 'Noto Sans TC','PingFang TC',sans-serif;fill:#263b30}.red{fill:#bd4b3a}.blue{fill:#315f9e}.yellow{fill:#e3bd45}.green{fill:#6d926f}.wall{fill:#b9b3a4;stroke:#5d594e;stroke-width:2}
  </style>
  <rect class="bg" width="1600" height="900"/>
  <text x="80" y="76" class="ink" style="font:700 42px 'Noto Sans TC','PingFang TC',sans-serif">The Definition of Space in the Landscape</text>
  <text x="80" y="111" class="muted body">景觀設計的互動式空間構成｜尺寸、植栽、牆體與檢核在同一模型中連動</text>
  <line x1="80" y1="138" x2="1520" y2="138" class="rule"/>

  <g transform="translate(80 182)">
    <text class="number red">01</text><text x="66" y="0" class="heading ink">水平・垂直分割</text>
    <text y="30" class="body muted">底紙比例與模組構圖</text>
    <rect x="18" y="65" width="160" height="226" class="thin"/>
    <rect x="18" y="111" width="160" height="160" fill="#f5eed7" stroke="#263b30" stroke-width="2"/>
    <line x1="98" y1="111" x2="98" y2="271" class="thin"/><line x1="18" y1="191" x2="178" y2="191" class="thin"/>
    <path d="M18 94h160m-160 0 8-5m-8 5 8 5m152 0-8-5m8 5-8 5" class="thin"/>
    <text x="98" y="88" text-anchor="middle" class="dim">21.0 cm</text>
    <path d="M195 65v226m0-226-5 8m5-8 5 8m0 218-5-8m5 8 5-8" class="thin"/>
    <text x="213" y="185" transform="rotate(90 213 185)" text-anchor="middle" class="dim">29.7 cm</text>
    <text x="98" y="300" text-anchor="middle" class="note ink">A4：1:√2｜21.0 × 29.7 cm</text>
    <text x="98" y="322" text-anchor="middle" class="note ink">內裁切正方形：1:√1｜21.0 × 21.0 cm</text>
    <text x="18" y="354" class="small muted">1:100 對應基地：21.0 × 21.0 m</text>
    <text x="18" y="377" class="small muted">根號矩形・整數比・黃金比例快顯說明</text>
  </g>

  <g transform="translate(450 182)">
    <text class="number blue">02</text><text x="66" y="0" class="heading ink">弧線分割</text>
    <text y="30" class="body muted">將構圖轉為可作圖的幾何</text>
    <rect x="20" y="65" width="230" height="230" fill="#f8f6ee" stroke="#263b30" stroke-width="2"/>
    <path d="M20 65h115v115H20z" class="red" opacity=".9"/><path d="M135 180h115v115H135z" class="blue" opacity=".9"/><path d="M20 295c0-127 103-230 230-230" class="yellow" opacity=".9"/>
    <path d="M20 295A230 230 0 0 0 250 65M20 180H250M135 65V295" class="line"/>
    <circle cx="135" cy="180" r="4" class="ink"/><path d="M125 180h20M135 170v20" class="line"/>
    <text x="77.5" y="174" text-anchor="middle" class="note ink">10.5</text><text x="192.5" y="174" text-anchor="middle" class="note ink">10.5</text>
    <text x="128" y="113" text-anchor="end" class="note ink">7.0</text><text x="128" y="223" text-anchor="end" class="note ink">7.0</text><text x="128" y="278" text-anchor="end" class="note ink">7.0</text>
    <path d="M20 316h230m-230 0 8-5m-8 5 8 5m222 0-8-5m8 5-8 5" class="thin"/>
    <text x="135" y="337" text-anchor="middle" class="dim">基地 21.0 × 21.0 m（1:100）</text>
    <text x="20" y="370" class="small muted">水平 10.5 + 10.5 m（1:1）；</text>
    <text x="20" y="393" class="small muted">垂直 7.0 + 7.0 + 7.0 m（1:1:1）。</text>
  </g>

  <g transform="translate(820 182)">
    <text class="number yellow">03</text><text x="66" y="0" class="heading ink">把構圖轉為空間</text>
    <text y="30" class="body muted">植栽分頁集中設定與配置</text>
    <rect x="20" y="65" width="230" height="230" fill="#f8f6ee" stroke="#263b30" stroke-width="2"/>
    <path d="M20 65h115v115H20z" class="red" opacity=".82"/><path d="M135 180h115v115H135z" class="blue" opacity=".82"/><path d="M20 295c0-127 103-230 230-230" class="yellow" opacity=".84"/>
    <g fill="#bcd1b5" stroke="#36543e" stroke-width="3"><circle cx="62" cy="109" r="29"/><circle cx="110" cy="109" r="29"/><circle cx="158" cy="109" r="29"/><circle cx="206" cy="109" r="29"/><circle cx="174" cy="225" r="29"/><circle cx="211" cy="239" r="23"/><circle cx="192" cy="197" r="22"/></g>
    <g stroke="#36543e" stroke-width="4"><path d="M62 138v17M110 138v17M158 138v17M206 138v17M174 254v17M211 262v15M192 219v15"/></g>
    <text x="20" y="327" class="note ink">基地 21.0 × 21.0 m｜整形樹：樹冠幅 4 m × 4 m</text>
    <text x="20" y="349" class="note ink">樹高 4 / 8 / 12 m｜DBH 25 cm</text>
    <text x="20" y="371" class="note ink">枝下高 1.5 / 3.0 / 4.5 m</text>
    <text x="20" y="397" class="small muted">樹陣・樹列・孤植・自然式叢植</text>
    <text x="20" y="420" class="small muted">樹心可貼邊，樹冠可跨越邊界或牆體。</text>
  </g>

  <g transform="translate(1190 182)">
    <text class="number ink">04</text><text x="66" y="0" class="heading ink">以牆定義空間</text>
    <text y="30" class="body muted">牆體、開口、圖層與即時檢核</text>
    <rect x="20" y="65" width="230" height="230" fill="#f8f6ee" stroke="#263b30" stroke-width="2"/>
    <path d="M20 65h115v115H20z" class="red" opacity=".78"/><path d="M135 180h115v115H135z" class="blue" opacity=".78"/><path d="M20 295c0-127 103-230 230-230" class="yellow" opacity=".75"/>
    <path d="M35 82H130M140 82H235M35 278V178M235 178V278M80 150H190M80 150v76" class="wall" stroke-width="12" fill="none"/>
    <path d="M130 82h10M35 178v-16M235 162v16" stroke="#f8f6ee" stroke-width="16"/>
    <path d="M35 82H130M140 82H235M35 278V178M235 178V278M80 150H190M80 150v76" class="dash"/>
    <path d="M72 255h106" stroke="#263b30" stroke-width="2" marker-end="url(#arrow)"/><text x="125" y="246" text-anchor="middle" class="note ink">移動牆段</text>
    <text x="20" y="327" class="note ink">基地 21.0 × 21.0 m｜牆高 ≤ 2.4 m</text>
    <text x="20" y="349" class="note ink">移動牆段總長 ≤ 原始總長 25%</text>
    <text x="20" y="371" class="note ink">全部開口總面積 ≤ 12 m²（愈少愈好）</text>
    <text x="20" y="397" class="small muted">固定原始配置後啟用限制；超額即拒絕。</text>
    <text x="20" y="420" class="small muted">牆段、開口與圖層鎖定皆可編輯。</text>
  </g>

  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#263b30"/></marker></defs>
  <line x1="80" y1="665" x2="1520" y2="665" class="rule"/>
  <g transform="translate(80 716)">
    <text class="heading ink">同一模型，多視圖驗證</text>
    <text y="31" class="body muted">平面圖・剖立面圖・軸測圖同步反映底紙、弧線、植栽尺寸、牆體保留段與開口。</text>
  </g>
  <g transform="translate(1080 700)">
    <rect width="120" height="78" fill="#e8e6dc" stroke="#263b30"/><path d="M13 61l36-26 35 12 25-23" class="line"/><circle cx="49" cy="35" r="13" fill="#bcd1b5" stroke="#36543e" stroke-width="2"/>
    <rect x="154" width="120" height="78" fill="#e8e6dc" stroke="#263b30"/><path d="M164 62h98M185 62V25h36v37M233 62V40h18v22" class="line"/><circle cx="200" cy="18" r="13" fill="#bcd1b5" stroke="#36543e" stroke-width="2"/>
    <rect x="308" width="120" height="78" fill="#e8e6dc" stroke="#263b30"/><path d="M322 54l35-18 35 11-35 18zM357 36v25M392 47v22" class="line"/><path d="M331 44l16-9M370 50l13-7" class="wall"/>
    <text x="60" y="101" text-anchor="middle" class="small muted">平面</text><text x="214" y="101" text-anchor="middle" class="small muted">剖立面</text><text x="368" y="101" text-anchor="middle" class="small muted">軸測</text>
  </g>
</svg>
